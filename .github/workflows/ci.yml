name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test helpers/agentHub.test.ts helpers/projectBuilder.test.ts helpers/modelRouter.test.ts
