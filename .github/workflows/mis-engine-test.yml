name: Miś Engine test

on:
  push:
    branches:
      - test/mis-engine-v1
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Miś Engine tests
        run: npm run test:mis
      - name: TypeScript and Vite build
        run: npm run build
