name: Nexus CI

on:
  push:
    branches:
      - feat/independent-nexus-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci

      - name: Summarize dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities ?? {};
          for (const [name, issue] of Object.entries(vulnerabilities)) {
            console.log(JSON.stringify({
              package: name,
              severity: issue.severity,
              direct: issue.isDirect,
              range: issue.range,
              fixAvailable: issue.fixAvailable,
              advisories: (issue.via ?? []).filter((item) => typeof item === 'object').map((item) => ({
                title: item.title,
                url: item.url,
                range: item.range,
              })),
            }));
          }
          console.log('Total vulnerabilities:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          NODE
      - name: Type-check and build
        run: npm run build
      - name: Test model tool calling
        run: npm run test:agent
      - name: Test specialist orchestration
        run: npm run test:team
      - name: Test SEO crawler and integrations
        run: npm run test:seo
      - name: Test Luna neural voice adapter
        run: npm run test:voice
      - name: Test Agent Hub
        run: npm run test:hub
      - name: Test private Luna mobile gateway
        run: node --test scripts/mobile-server.test.mjs
      - name: Test image intent
        run: npm run test:image
      - name: Test image Hub proxy
        run: npm run test:image-hub
