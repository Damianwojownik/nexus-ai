name: Nexus independent core CI

on:
  pull_request:
  push:
    branches:
      - "feature/nexus-independent-chat-tools"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Connector configuration safety tests
        run: npm run test:connectors
      - name: Agent Hub regression tests
        run: npm run test:hub
