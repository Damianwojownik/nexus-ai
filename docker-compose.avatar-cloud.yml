services:
  nexus-avatar-cloud:
    build:
      context: .
      dockerfile: services/avatar_cloud/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NEXUS_CLOUD_AVATAR_TOKEN: ${NEXUS_CLOUD_AVATAR_TOKEN}
      NEXUS_LIVEPORTRAIT_URL: http://host.docker.internal:9872
      NEXUS_MUSETALK_URL: http://musetalk:9881
      NEXUS_ECHOMIMIC_URL: http://echomimic:9882
      NEXUS_ENGINE_EDITOR: "false"
    restart: unless-stopped

  # GPU workers are deliberately separate services. Their concrete images are
  # pinned after model-license and VRAM tests; the orchestrator contract above
  # does not change when an implementation is swapped.
